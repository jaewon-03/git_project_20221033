<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"> <!-- 계산기 배경에 반복해서 깔리는 120x120 크기 무늬 한 칸입니다. -->
  <rect width="120" height="120" fill="#fdf4f7"/> <!-- 무늬 한 칸 전체를 연한 분홍색으로 칠합니다. -->
  <g transform="translate(36 40)"> <!-- 고양이 얼굴을 왼쪽 위에 놓습니다. -->
    <path d="M-17 -5 L-14 -22 L-3 -14 Z" fill="#fbcfe8"/> <!-- 고양이 왼쪽 귀를 그립니다. -->
    <path d="M17 -5 L14 -22 L3 -14 Z" fill="#fbcfe8"/> <!-- 고양이 오른쪽 귀를 그립니다. -->
    <circle r="18" fill="#fbcfe8"/> <!-- 고양이 동그란 얼굴을 그립니다. -->
    <circle cx="-6" cy="-3" r="2.3" fill="#475569"/> <!-- 고양이 왼쪽 눈을 그립니다. -->
    <circle cx="6" cy="-3" r="2.3" fill="#475569"/> <!-- 고양이 오른쪽 눈을 그립니다. -->
    <circle cx="-11" cy="4" r="3" fill="#f9a8d4"/> <!-- 고양이 왼쪽 볼터치를 그립니다. -->
    <circle cx="11" cy="4" r="3" fill="#f9a8d4"/> <!-- 고양이 오른쪽 볼터치를 그립니다. -->
    <path d="M-4 3 Q-2 6 0 3 Q2 6 4 3" fill="none" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/> <!-- 고양이 입을 ω 모양으로 그립니다. -->
  </g> <!-- 고양이 얼굴 그리기를 마칩니다. -->
  <g transform="translate(88 86)" fill="#bfdbfe"> <!-- 하늘색 발바닥을 오른쪽 아래에 놓습니다. -->
    <ellipse cx="0" cy="4" rx="9" ry="7"/> <!-- 발바닥 가운데 큰 볼록살을 그립니다. -->
    <circle cx="-9" cy="-6" r="3.5"/> <!-- 발바닥 왼쪽 발가락을 그립니다. -->
    <circle cx="-3" cy="-10" r="3.5"/> <!-- 발바닥 가운데 왼쪽 발가락을 그립니다. -->
    <circle cx="4" cy="-10" r="3.5"/> <!-- 발바닥 가운데 오른쪽 발가락을 그립니다. -->
    <circle cx="10" cy="-6" r="3.5"/> <!-- 발바닥 오른쪽 발가락을 그립니다. -->
  </g> <!-- 발바닥 그리기를 마칩니다. -->
  <path d="M92 26 C92 20 100 19 100 25 C100 19 108 20 108 26 C108 32 100 36 100 39 C100 36 92 32 92 26 Z" fill="#fecaca"/> <!-- 오른쪽 위에 분홍 하트를 그립니다. -->
  <path d="M28 82 L31 89 L38 89 L32.5 93.5 L34.5 100.5 L28 96.5 L21.5 100.5 L23.5 93.5 L18 89 L25 89 Z" fill="#fde68a"/> <!-- 왼쪽 아래에 노란 별을 그립니다. -->
</svg> <!-- 무늬 한 칸 그리기를 마칩니다. -->
