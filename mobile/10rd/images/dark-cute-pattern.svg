<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"> <!-- 계산기 배경에 반복해서 깔리는 120x120 크기 무늬 한 칸입니다. (쿠로미 느낌, 직접 그린 그림) -->
  <rect width="120" height="120" fill="#3b2a4f"/> <!-- 무늬 한 칸 전체를 진한 보라색으로 칠합니다. -->
  <g transform="translate(34 38)" fill="#f9a8d4"> <!-- 핑크 해골을 왼쪽 위에 놓습니다. -->
    <circle cx="0" cy="-2" r="14"/> <!-- 해골의 동그란 머리를 그립니다. -->
    <rect x="-8" y="6" width="16" height="10" rx="4"/> <!-- 해골의 턱을 그립니다. -->
  </g> <!-- 해골 모양 그리기를 마칩니다. -->
  <g transform="translate(34 38)" fill="#3b2a4f"> <!-- 해골의 눈·코를 같은 자리에 겹쳐 그립니다. -->
    <ellipse cx="-5" cy="-1" rx="3.2" ry="4"/> <!-- 해골의 왼쪽 눈을 그립니다. -->
    <ellipse cx="5" cy="-1" rx="3.2" ry="4"/> <!-- 해골의 오른쪽 눈을 그립니다. -->
    <path d="M-1.6 7 L1.6 7 L0 4.2 Z"/> <!-- 해골의 작은 세모 코를 그립니다. -->
  </g> <!-- 해골 눈·코 그리기를 마칩니다. -->
  <path d="M31 48 V53 M34 48 V53 M37 48 V53" stroke="#3b2a4f" stroke-width="1.2" stroke-linecap="round"/> <!-- 해골의 이빨 줄 세 개를 그립니다. -->
  <path d="M92 24 C92 18 100 17 100 23 C100 17 108 18 108 24 C108 30 100 34 100 37 C100 34 92 30 92 24 Z" fill="#ff8fbf"/> <!-- 오른쪽 위에 핑크 하트를 그립니다. -->
  <path d="M28 82 L31 89 L38 89 L32.5 93.5 L34.5 100.5 L28 96.5 L21.5 100.5 L23.5 93.5 L18 89 L25 89 Z" fill="#d8c6f0"/> <!-- 왼쪽 아래에 연보라 별을 그립니다. -->
  <path d="M74 88 Q78 80 82 86 Q85 79 88 84 Q91 79 94 86 Q98 80 102 88 Q96 87 94 92 Q91 89 88 93 Q85 89 82 92 Q80 87 74 88 Z" fill="#1f1629"/> <!-- 오른쪽 아래에 작은 박쥐 날개를 그립니다. -->
  <circle cx="64" cy="18" r="2" fill="#d8c6f0"/> <!-- 위쪽 가운데에 작은 연보라 점을 찍습니다. -->
  <circle cx="60" cy="66" r="2" fill="#ff8fbf"/> <!-- 가운데에 작은 핑크 점을 찍습니다. -->
  <circle cx="106" cy="60" r="1.6" fill="#d8c6f0"/> <!-- 오른쪽에 작은 연보라 점을 찍습니다. -->
</svg> <!-- 무늬 한 칸 그리기를 마칩니다. -->
