<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"> <!-- 계산기 제목 앞에 들어가는 64x64 크기 고양이 얼굴 그림입니다. -->
  <path d="M9 30 L13 6 L28 18 Z" fill="#f9a8d4"/> <!-- 고양이 왼쪽 귀를 그립니다. -->
  <path d="M55 30 L51 6 L36 18 Z" fill="#f9a8d4"/> <!-- 고양이 오른쪽 귀를 그립니다. -->
  <circle cx="32" cy="36" r="24" fill="#fbcfe8"/> <!-- 고양이 동그란 얼굴을 그립니다. -->
  <circle cx="24" cy="33" r="3.2" fill="#475569"/> <!-- 고양이 왼쪽 눈을 그립니다. -->
  <circle cx="40" cy="33" r="3.2" fill="#475569"/> <!-- 고양이 오른쪽 눈을 그립니다. -->
  <circle cx="17" cy="42" r="4" fill="#f9a8d4"/> <!-- 고양이 왼쪽 볼터치를 그립니다. -->
  <circle cx="47" cy="42" r="4" fill="#f9a8d4"/> <!-- 고양이 오른쪽 볼터치를 그립니다. -->
  <path d="M26 41 Q29 45 32 41 Q35 45 38 41" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/> <!-- 고양이 입을 ω 모양으로 그립니다. -->
</svg> <!-- 고양이 얼굴 그리기를 마칩니다. -->
