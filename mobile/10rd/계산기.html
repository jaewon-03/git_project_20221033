<!DOCTYPE html> <!-- 한국어 페이지로 계산기 문서를 시작합니다. -->
<html lang="ko"> <!-- 문서의 기본 언어를 한국어로 지정합니다. -->
<head> <!-- 페이지 설정 영역을 엽니다. -->
  <meta charset="UTF-8"> <!-- 한글이 깨지지 않도록 문자 인코딩을 지정합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 화면에 맞춰 표시합니다. -->
  <title>간단 계산기</title> <!-- 브라우저 탭에 표시할 제목입니다. -->
  <link rel="stylesheet" href="css/calculator.css"> <!-- 계산기 스타일 파일(css/calculator.css)을 불러옵니다. -->
</head> <!-- 페이지 설정 영역을 닫습니다. -->
<body> <!-- 화면에 보이는 계산기 영역을 엽니다. -->
  <main class="calculator"> <!-- 계산기의 본체를 만듭니다. -->
    <h1>간단 계산기</h1> <!-- 계산기 제목을 표시합니다. -->
    <output id="display" aria-live="polite">0</output> <!-- 입력값과 계산 결과를 표시합니다. -->
    <div class="buttons" id="buttonArea"> <!-- 숫자·연산자·Clear·= 버튼을 담는 영역입니다. (JS의 buttonArea) -->
      <button type="button" class="number" data-value="7">7</button> <!-- 숫자 7 입력 버튼입니다. -->
      <button type="button" class="number" data-value="8">8</button> <!-- 숫자 8 입력 버튼입니다. -->
      <button type="button" class="number" data-value="9">9</button> <!-- 숫자 9 입력 버튼입니다. -->
      <button type="button" class="operator" data-value="/">÷</button> <!-- 나누기 연산 버튼입니다. -->
      <button type="button" class="number" data-value="4">4</button> <!-- 숫자 4 입력 버튼입니다. -->
      <button type="button" class="number" data-value="5">5</button> <!-- 숫자 5 입력 버튼입니다. -->
      <button type="button" class="number" data-value="6">6</button> <!-- 숫자 6 입력 버튼입니다. -->
      <button type="button" class="operator" data-value="*">×</button> <!-- 곱하기 연산 버튼입니다. -->
      <button type="button" class="number" data-value="1">1</button> <!-- 숫자 1 입력 버튼입니다. -->
      <button type="button" class="number" data-value="2">2</button> <!-- 숫자 2 입력 버튼입니다. -->
      <button type="button" class="number" data-value="3">3</button> <!-- 숫자 3 입력 버튼입니다. -->
      <button type="button" class="operator" data-value="-">−</button> <!-- 빼기 연산 버튼입니다. -->
      <button type="button" class="clear" data-value="clear">Clear</button> <!-- 현재 계산 상태를 지웁니다. -->
      <button type="button" class="number" data-value="0">0</button> <!-- 숫자 0 입력 버튼입니다. -->
      <button type="button" class="operator" data-value="+">+</button> <!-- 더하기 연산 버튼입니다. -->
      <button type="button" class="equals" data-value="=">=</button> <!-- 계산 결과를 구하는 버튼입니다. -->
    </div> <!-- 버튼 영역을 닫습니다. -->
  </main> <!-- 계산기 본체를 닫습니다. -->
  <script src="js/calculator.js"></script> <!-- 계산기 동작 파일(js/calculator.js)을 불러옵니다. -->
</body> <!-- 화면 영역을 닫습니다. -->
</html> <!-- 계산기 문서를 마칩니다. -->
