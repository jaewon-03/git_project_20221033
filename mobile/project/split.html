  <main class="inner" data-page="split">
    <section class="intro">
      <h1>N빵 계산기 💸</h1>
      <p>같이 먹은 금액을 사람 수대로 나눠요. 고른 금액 단위로 올림해서 계산하고, 남는 돈까지 알려드려요.</p>
    </section>

    <div class="split-grid">
      <!-- 왼쪽: 입력 -->
      <section class="panel">
        <h2><span class="step">1</span>얼마를 나눌까요?</h2>

        <form class="split-form" id="splitForm" novalidate>
          <div class="form-row">
            <label for="totalInput">총 금액</label>
            <div class="input-unit">
              <input type="number" id="totalInput" inputmode="numeric" min="0" step="100" placeholder="예: 48000">
              <span>원</span>
            </div>
          </div>

          <div class="form-row">
            <label for="extraInput">배달비·추가 금액 <small>(선택)</small></label>
            <div class="input-unit">
              <input type="number" id="extraInput" inputmode="numeric" min="0" step="100" placeholder="0">
              <span>원</span>
            </div>
          </div>

          <div class="form-row">
            <label for="peopleInput">인원</label>
            <div class="stepper">
              <button type="button" class="stepper-btn" id="peopleMinus" aria-label="인원 줄이기">−</button>
              <input type="number" id="peopleInput" inputmode="numeric" min="2" max="30" value="4">
              <button type="button" class="stepper-btn" id="peoplePlus" aria-label="인원 늘리기">+</button>
              <span>명</span>
            </div>
          </div>

          <div class="form-row">
            <label for="roundSelect">금액 단위</label>
            <select id="roundSelect" class="select">
              <option value="1">1원 단위 (그대로)</option>
              <option value="10">10원 단위로 올림</option>
              <option value="100" selected>100원 단위로 올림</option>
              <option value="1000">1,000원 단위로 올림</option>
            </select>
          </div>
        </form>

        <div class="split-quick" id="splitQuick" hidden>
          <p>최근에 정한 메뉴: <strong id="recentMenuText"></strong></p>
          <button type="button" id="fillFromMenuBtn" class="text-btn">이 메뉴 가격 × 인원으로 채우기</button>
        </div>
      </section>

      <!-- 오른쪽: 결과 -->
      <section class="panel split-result-panel">
        <h2><span class="step">2</span>한 사람당</h2>
        <div class="split-result" aria-live="polite">
          <output id="perPerson" class="per-person" for="totalInput extraInput peopleInput roundSelect">0원</output>
          <p id="splitDetail" class="split-detail">총 금액을 입력해 주세요.</p>
        </div>

        <div class="action-row two">
          <a id="splitSmsLink" class="action-btn small">💬 문자로 보내기</a>
          <button type="button" id="splitCopyBtn" class="action-btn small">🔗 복사하기</button>
        </div>
        <button type="button" id="splitResetBtn" class="text-btn split-reset">처음부터 다시</button>
      </section>
    </div>
  </main>
