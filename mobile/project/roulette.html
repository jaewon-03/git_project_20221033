    </div>

  <main class="inner" data-page="roulette">
    <section class="intro">
      <h1>돌림판 🎡</h1>
      <p>후보를 직접 넣고 돌려 보세요. 학교 앞 단골집, 메뉴, "오늘 누가 계산?"까지 뭐든 정할 수 있어요.</p>
    </section>

    <div class="roulette-grid">
      <!-- 왼쪽: 돌림판 -->
      <section class="panel wheel-panel">
        <div class="wheel-wrap">
          <span class="wheel-pointer" aria-hidden="true"></span>
          <canvas id="wheelCanvas" class="wheel-canvas" width="440" height="440" role="img" aria-label="돌림판"></canvas>
          <button type="button" id="spinBtn" class="wheel-center">돌리기</button>
        </div>

        <div class="wheel-result" id="wheelResult" aria-live="polite">
          <p class="wheel-result-label">결과</p>
          <!-- 결과가 메뉴 목록에 있는 메뉴면 사진도 보여줌 -->
          <span class="thumb wheel-result-photo" id="wheelResultPhoto" hidden></span>
          <strong id="wheelResultText">돌림판을 돌려 보세요!</strong>
          <div class="wheel-result-actions" id="wheelResultActions" hidden>
            <a id="wheelMapLink" class="action-btn small" target="_blank" rel="noopener">📍 지도에서 찾기</a>
            <a id="wheelSmsLink" class="action-btn small">💬 문자</a>
            <button type="button" id="wheelShareBtn" class="action-btn small">🔗 공유·복사</button>
            <button type="button" id="wheelRemoveBtn" class="action-btn small">🔄 이거 빼고 다시</button>
            <button type="button" id="wheelDecideBtn" class="action-btn small primary">✅ 이걸로 결정</button>
          </div>
        </div>
      </section>

      <!-- 오른쪽: 후보 편집 -->
      <section class="panel option-panel">
        <h2><span class="step">✎</span>후보 정하기 <small id="optionCount" class="option-count"></small></h2>

        <form class="option-form" id="optionForm">
          <label for="optionInput" class="sr-only">후보 이름</label>
          <input type="text" id="optionInput" maxlength="16" placeholder="예: 학교 앞 김밥천국" autocomplete="off">
          <button type="submit" class="action-btn primary-soft">추가</button>
        </form>

        <ul class="option-list" id="optionList"></ul>

        <div class="option-quick">
          <p class="option-quick-label">한 번에 채우기</p>
          <div class="chips">
            <button type="button" class="chip" data-fill="random">🎲 메뉴 8개 무작위</button>
            <button type="button" class="chip" data-fill="favorites">⭐ 즐겨찾기 메뉴</button>
            <button type="button" class="chip" data-fill="people">🙋 누가 계산? (사람 4명)</button>
            <button type="button" class="chip" data-fill="clear">🧹 모두 지우기</button>
          </div>
        </div>
        <p class="option-tip">후보는 2~12개까지 넣을 수 있어요. 넣은 후보는 이 브라우저에 기억돼요.</p>
      </section>
    </div>
  </main>
